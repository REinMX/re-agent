# Example site contract, schema version 2.1: a company Linux host with Komodo.
# Placeholders only. Get each value from your team or IT. Do not guess. Do not commit the filled copy.
# Copy to ~/.config/re-agent/site.contract.yml (user level) or to <project>/site.contract.yml.
# Check: python tools/doctor.py --mode agent --contract <copy> --profile company
# On a tcsh login shell: setenv RE_AGENT_PROFILE company

schema_version: 2
active_profile: company

profiles:
  company:
    agent_host: "<ASK: linux|windows>"
    execution_mode: "<ASK: direct|manual>"
    data_classification: "<ASK>"
    model_endpoint: "<ASK: approved model endpoint id; never credentials>"
    endpoint_approved: false             # set true only after the site decision
    python: "<ASK: full path to the Komodo python>"
    activate: "<ASK: full activate command>"
    activate_shell: "<ASK: bash|tcsh>"
    activate_bash: ""                    # optional: a bash activate command for bash runners
    komodo_release: "<ASK: release label>"
    ert:
      executable: ert
      version: "<ASK: ert version>"
    simulator:
      name: "<ASK: FLOW|ECLIPSE100|ECLIPSE300|IX>"
      executable: "<ASK: from Komodo or the site wrapper>"
      wrapper: komodo
      version: "<ASK: simulator version>"
      forward_model: "<ASK: forward-model name>"
      license_env: "<ASK: variable name only>"
      license_server: ""                 # never put a license host here
    flow_cmd:
    flow_extra_args:
    queue:
      system: "<ASK: LOCAL|LSF|SLURM|TORQUE>"
      max_running: "<ASK>"
      name: "<ASK: queue or partition>"
      options: {}
    scratch_root: "<ASK: site scratch folder>"
    output_root: "<ASK: owned deliverables folder>"
    resinsight:
      bin: ""
      headless: none
      gui_launcher: ""
      version: ""
      python: ""
    sumo:
      enabled: false
      environment: "<ASK>"
    everest:
      enabled: false
    everest_executable: ""               # the Everest command; empty when the profile has no Everest
    versions: {}                         # optional: distribution -> expected version prefix

# Project level: keep real project values in local files only.
project: "<ASK: short project name>"
eclbase: "<ASK: deck base, relative to the runpath>"
runpath:
  pattern: realization-<IENS>/iter-<ITER>
  default_iter: iter-0
expected_realizations: "<ASK: number of realizations>"
p10_p90: "<ASK: numerical|exceedance>"
paths:
  deliverables: ${output_root}
vectors:
  required_summary: ["<ASK: list of summary vectors>"]
