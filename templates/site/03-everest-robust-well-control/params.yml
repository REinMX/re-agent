# Template values. render_template.py reads the defaults here; --set name=value overrides one.
# A null value has no default: give it with --set. The defaults document the public Drogon example
# (OPM/opm-tests, ODbL). Replace them with the values of your model.

agent_root: null                  # absolute path of the reservoir-engineer-agent checkout (or .reservoir-agent)
case_name: well_control
pred_deck: null                   # absolute path of the prediction DATA file (Drogon example: DROGON_PRED.DATA)
restart_link: HIST/DROGON         # the RESTART root in the prediction deck, relative to the runpath
restart_glob: model/DROGON-*.UNRST  # the restart file in each posterior realization
include_dir: include              # the include folder of each posterior realization (it holds the history-match includes)
schedule_file: pred.sch           # the file that the prediction deck includes for the controlled schedule
flow_args: --threads-per-process=1  # options for the simulator itself. The ERT FLOW step must not get --threads.

ahm_case: drogon_ahm              # the history-match case in the scratch folder
ahm_last_iter: 4                  # the posterior iteration
realizations: [0, 1, 2, 3, 4, 5, 6, 7]  # dry run only; the posterior link snippet gives them otherwise
random_seed: 20261015
max_runtime: 1200

start: 2020-07-01
end: 2025-01-01
periods: [2020-07-01, 2021-07-01, 2022-07-01, 2023-07-01]
report_months: 3
bhp_min_prod: 150.0
bhp_max_inj: 500.0
producers: {A1: 3000.0, A2: 4000.0, A3: 4000.0, A4: 4000.0}   # default liquid rate of each producer
injectors: {A5: 6500.0, A6: 6500.0}                            # initial water rate of each injector
controlled_producers: [A1, A2, A4]

inj_min: 1000.0
inj_max: 12000.0
inj_perturbation: 500.0
prod_min: 500.0
prod_max: 6000.0
prod_perturbation: 250.0
injection_capacity: 14000.0       # field water injection capacity in each period
max_fwpr: 15000.0                 # output constraint: maximum field water production rate
min_vrr: 0.9                      # output constraint: minimum voidage replacement ratio
cvar_percentile: 0.25             # CVaR over the worst 25 % of the realizations

oil_price: 400.0                  # per Sm3
gas_price: 0.12                   # per Sm3
water_production_cost: 30.0       # per Sm3
water_injection_cost: 10.0        # per Sm3
discount_rate: 0.08

jobs: everest_models  # everest_models or custom
